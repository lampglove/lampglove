<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>NightFix – Admin</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.76.1/dist/umd/supabase.min.js"></script>
<style>
body{font-family:Arial,sans-serif;background:#eef3fb;color:#0f172a;margin:0;padding:16px}
input,select,button{padding:10px;border-radius:8px;border:1px solid #c3d0ea;font-size:15px}
button{background:#1d4ed8;color:#fff;border:0;font-weight:bold;cursor:pointer}
#login{max-width:320px;margin:60px auto;display:grid;gap:10px}
#app{display:none}.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.w{overflow-x:auto}table{border-collapse:collapse;width:100%;background:#ffffff;font-size:14px}
th{background:#1d4ed8;color:#fff}td,th{padding:8px;border-bottom:1px solid #d5def0;text-align:start;white-space:nowrap}
.Confirmed{background:#c6efce}.Waiting{background:#ffeb9c}.False\ order{background:#ffc7ce}.On\ check{background:#bdd7ee}.Double\ order{background:#e4c8f0}
.imgs{margin-top:28px;background:#ffffff;border:1px solid #d5def0;border-radius:12px;padding:16px}
.grid{display:flex;flex-wrap:wrap;gap:12px;margin-top:12px}.it{width:130px;text-align:center}
.it img{width:130px;height:130px;object-fit:cover;border-radius:10px;border:1px solid #c3d0ea}
.it button{padding:4px 8px;margin:3px 1px;font-size:13px}.it .del{background:#c0392b}
.mini{max-width:380px;border:2px solid #c3d0ea;border-radius:14px;padding:10px;background:#f7faff;display:grid;gap:8px}
.mini .r3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.mini button{background:#fff;color:#0f172a;border:2px dashed #9fb3de;padding:10px 4px;border-radius:10px;font-size:13px;position:relative;line-height:1.3}
.mini button.on{background:#1d4ed8;color:#fff;border-style:solid}.mini button .n{position:absolute;top:-8px;inset-inline-end:-6px;background:#16a34a;color:#fff;border-radius:10px;font-size:11px;padding:0 6px}
.mini .big{padding:26px 4px}
#panel{margin-top:14px}</style></head><body>
<form id="login"><h2>Admin</h2>
 <input id="em" name="email" type="email" placeholder="Email" autocomplete="username" required>
 <input id="pw" name="password" type="password" placeholder="Mot de passe" autocomplete="current-password" required>
 <label style="font-size:14px"><input type="checkbox" id="rm" checked style="width:auto"> Rester connecté sur cet appareil</label>
 <button id="go" type="submit">Connexion</button><small id="err" style="color:#c00"></small></form>
<div id="app">
 <div class="bar"><b id="cnt"></b><select id="flt"><option value="">Tous</option><option>Confirmed</option><option>Waiting</option><option>False order</option><option>On check</option><option>Double order</option></select><button id="rf">Actualiser</button><button id="out">Déconnexion</button></div>
 <div class="w"><table><thead><tr><th>Date</th><th>Nom</th><th>Téléphone</th><th>Wilaya</th><th>Adresse</th><th>Qté</th><th>Livraison</th><th>Prix liv.</th><th>Total</th><th>Statut</th></tr></thead><tbody id="rows"></tbody></table></div>
<div class="imgs"><h3 style="margin:0 0 4px">Images de la page de vente</h3>
 <p style="font-size:13px;color:#5b6784;margin:0 0 10px">Cliquez sur une zone pour choisir où placer vos images :</p>
 <div class="mini" id="mini"></div>
 <div id="panel"></div></div>
</div>
<script>
const SUPABASE_URL="https://ifgajqynclqruungignf.supabase.co", SUPABASE_KEY="sb_publishable_WFCsqUHp4gGwKXBG3PutZg_YjJ2r0dD";   // mêmes valeurs que index.html
const $=s=>document.querySelector(s);
if(!SUPABASE_URL||!SUPABASE_KEY){$("#err").textContent="⚠️ SUPABASE_URL / SUPABASE_KEY manquants dans admin.html";throw new Error("missing keys")}
if(!window.supabase){$("#err").textContent="⚠️ Bibliothèque Supabase non chargée (vérifiez la connexion)";throw new Error("lib")}
const store=()=>localStorage.getItem("rm")==="0"?sessionStorage:localStorage;
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:true,autoRefreshToken:true,
 storage:{getItem:k=>store().getItem(k),setItem:(k,v)=>store().setItem(k,v),removeItem:k=>{localStorage.removeItem(k);sessionStorage.removeItem(k)}}}});
if(localStorage.getItem("rm_email"))$("#em").value=localStorage.getItem("rm_email");
const ST=["Confirmed","Waiting","False order","On check","Double order"];
const esc=t=>String(t??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
async function load(){
  let q=sb.from("orders_pack").select("*").order("created_at",{ascending:false}).limit(500);
  if($("#flt").value)q=q.eq("status",$("#flt").value);
  const {data,error}=await q;if(error){alert(error.message);return}
  $("#cnt").textContent=data.length+" commandes";
  $("#rows").innerHTML=data.map(o=>`<tr><td>${new Date(o.created_at).toLocaleString("fr-DZ")}</td><td>${esc(o.name)}</td><td><a href="tel:${esc(o.phone)}">${esc(o.phone)}</a></td><td>${esc(o.wilaya)}</td><td>${esc(o.address)}</td><td>${o.qty}</td><td>${esc(o.delivery)}</td><td>${o.delivery_price}</td><td>${o.total}</td>
  <td><select class="${o.status}" data-id="${o.id}">${ST.map(s=>`<option ${s===o.status?"selected":""}>${s}</option>`).join("")}</select></td></tr>`).join("");
}
$("#rows").onchange=async e=>{const s=e.target;const {error}=await sb.from("orders_pack").update({status:s.value}).eq("id",s.dataset.id);if(error)alert(error.message);else s.className=s.value};
async function show(){const {data}=await sb.auth.getSession();const ok=!!data.session;$("#login").style.display=ok?"none":"grid";$("#app").style.display=ok?"block":"none";if(ok){load();loadImgs()}}
const SLOTS={gallery:["Galerie principale (en haut de la page)",1],feat1:["Carte 1 – lumière",0],feat2:["Carte 2 – tubes",0],feat3:["Carte 3 – pack",0],banner:["Bannière large (après les cartes)",0],content:["Grille d'images sous la description",1],order:["Bannière avant le formulaire",0]};
let cur="gallery",ALL=[];
const BUCKET="pack-images";
async function shrink(f){const bm=await createImageBitmap(f);const k=Math.min(1,1200/Math.max(bm.width,bm.height));
  const c=document.createElement("canvas");c.width=Math.round(bm.width*k);c.height=Math.round(bm.height*k);c.getContext("2d").drawImage(bm,0,0,c.width,c.height);
  return new Promise(r=>c.toBlob(r,"image/jpeg",.85))}
const inSlot=s=>ALL.filter(x=>(x.slot||"gallery")===s);
function zone(s,t,cls){return `<button data-s="${s}" class="${cls||""} ${s===cur?"on":""}">${t}<span class="n">${inSlot(s).length}</span></button>`}
function draw(){
  $("#mini").innerHTML=zone("gallery","📷 Galerie principale","big")+`<div class="r3">${zone("feat1","Carte 1")}${zone("feat2","Carte 2")}${zone("feat3","Carte 3")}</div>`+zone("banner","Bannière large")+zone("content","📝 Description : grille d'images","big")+zone("order","Bannière avant formulaire");
  const [label,multi]=SLOTS[cur],L=inSlot(cur);
  $("#panel").innerHTML=`<h4 style="margin:0 0 8px">${label}</h4>
   <input type="file" id="file" accept="image/*" ${multi?"multiple":""}> <button id="up">${multi?"Ajouter":"Remplacer"}</button> <small id="imsg"></small>
   <div class="grid">${L.map((x,i)=>`<div class="it"><img src="${esc(x.url)}"><div>${multi?`<button data-a="l" data-i="${i}">◀</button><button data-a="r" data-i="${i}">▶</button>`:""}<button class="del" data-a="d" data-i="${i}">🗑</button></div></div>`).join("")||"<small>Aucune image dans cette zone.</small>"}</div>`}
async function loadImgs(){const {data,error}=await sb.from("pack_images").select("*").order("position").order("id");
  if(error){$("#panel").innerHTML="<small>Erreur: "+esc(error.message)+" — avez-vous exécuté update-slots.sql ?</small>";return}
  ALL=data;draw()}
$("#mini").onclick=e=>{const b=e.target.closest("button");if(!b)return;cur=b.dataset.s;draw()};
$("#panel").onclick=async e=>{const b=e.target.closest("button");if(!b)return;
  if(b.id==="up")return upload();
  const L=inSlot(cur),i=+b.dataset.i,a=b.dataset.a;if(!a)return;
  if(a==="d"){if(!confirm("Supprimer cette image ?"))return;await sb.storage.from(BUCKET).remove([L[i].path]);await sb.from("pack_images").delete().eq("id",L[i].id)}
  else{const j=a==="l"?i-1:i+1;if(j<0||j>=L.length)return;const ids=L.map(x=>x.id);[ids[i],ids[j]]=[ids[j],ids[i]];
    await Promise.all(ids.map((id,p)=>sb.from("pack_images").update({position:p}).eq("id",id)))}
  loadImgs()};
async function upload(){const fs=[...$("#file").files];if(!fs.length)return;const [,multi]=SLOTS[cur];const old=inSlot(cur);
  $("#up").disabled=true;let pos=multi?old.length:0;
  try{for(const f of (multi?fs:[fs[0]])){$("#imsg").textContent="Envoi de "+f.name+"…";
    const blob=await shrink(f),path=cur+"/"+Date.now()+"-"+Math.random().toString(36).slice(2,8)+".jpg";
    const u=await sb.storage.from(BUCKET).upload(path,blob,{contentType:"image/jpeg"});if(u.error)throw u.error;
    const url=sb.storage.from(BUCKET).getPublicUrl(path).data.publicUrl;
    const r=await sb.from("pack_images").insert({url,path,position:pos++,slot:cur});if(r.error)throw r.error}
    if(!multi&&old.length){await sb.storage.from(BUCKET).remove(old.map(x=>x.path));await sb.from("pack_images").delete().in("id",old.map(x=>x.id))}
  }catch(e){$("#imsg").textContent="Erreur: "+e.message;$("#up").disabled=false;return}
  loadImgs()}
$("#login").onsubmit=async e=>{e.preventDefault();localStorage.setItem("rm",$("#rm").checked?"1":"0");if($("#rm").checked)localStorage.setItem("rm_email",$("#em").value);else localStorage.removeItem("rm_email");const {error}=await sb.auth.signInWithPassword({email:$("#em").value,password:$("#pw").value});if(error)$("#err").textContent=error.message;else show()};
$("#out").onclick=async()=>{await sb.auth.signOut();show()};$("#rf").onclick=load;$("#flt").onchange=load;show();
</script></body></html>
